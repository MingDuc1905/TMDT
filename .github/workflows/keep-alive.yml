# ═══ Keep-Alive: Ping Render mỗi 10 phút để tránh sleep timeout ═══
# Render free tier tự động sleep sau 15 phút không request
# → Request đầu tiên sau sleep mất 30-60s wake up → chatbot timeout
name: Keep-Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health keep app warm
        run: |
          echo "=== Keep-Alive: $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
          curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            "https://fastship-web.onrender.com/health" || \
            echo "(app may be waking up)"
